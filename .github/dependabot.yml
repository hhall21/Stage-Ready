version: 2
updates:
  - package-ecosystem: composer
    directory: /pt-tracker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /pt-tracker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite-toolchain:
        patterns:
          - vite
          - vite-plus
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
